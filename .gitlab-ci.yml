# Mirror of .github/workflows/ci.yml for GitLab CI. GitHub Actions is the pipeline that runs;
# this file shows the same three stages expressed for GitLab.
stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install ruff==0.16.9
    - ruff check .
    - ruff format --check .

test:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip, .cache/huggingface]
  variables:
    PRECISION: int8
  script:
    - pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
    - pip install -r requirements-dev.txt
    - python export.py --out models
    - pytest -q

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t clip-serve:ci .
    - docker images clip-serve:ci
    - docker run -d --name clip -p 8000:8000 clip-serve:ci
    - apk add --no-cache curl python3
    - for i in $(seq 1 60); do curl -fs docker:8000/readyz && break; sleep 1; done
    - python3 -c "import sys; sys.stdout.buffer.write(b'P6 64 64 255\n' + b'\xff\x00\x00' * 4096)" > red.ppm
    - curl -fs -F "file=@red.ppm" -F "labels=red, blue" docker:8000/classify | tee result.json
    - python3 -c "import json; r = json.load(open('result.json')); assert r['red'] > r['blue'], r"
  after_script:
    - docker logs clip || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
